name: "@kalo-build/plugin-openapi-morphe"
displayName: "OpenAPI to Morphe"
description: "Generates Morphe structures (.str) and enums (.enum) from an OpenAPI 3.1 specification. Structures only — no models or entities."
version: "1.0.0"

input:
  format: "KA:OA1:YAML1"
  description: "OpenAPI 3.1 YAML specification"
  suggestedStore:
    name: "KA_OA_YAML"
    type: "localFileSystem"
    path: "./docs/openapi"

output:
  format: "KA:MO1:YAML1"
  description: "Morphe YAML specification files (structures and enums)"
  suggestedStore:
    name: "KA_MO_YAML"
    type: "localFileSystem"
    path: "./morphe"

configSchema:
  specFileName:
    type: string
    description: "Name of the OpenAPI spec file to read (default: openapi.yaml)"
    default: "openapi.yaml"
  schemasToSkip:
    type: array
    description: "Component schema names to exclude from generation (e.g. request/response wrappers)"
    default: []
